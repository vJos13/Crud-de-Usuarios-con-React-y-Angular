# Alternativa a instalar SQL Server: levantarlo con Docker
#   docker compose up -d
#   docker compose exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TuPassword123!' -C -i /scripts/script.sql
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TuPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - ./database:/scripts:ro
